# MediaCrawler docker-compose
#   docker compose up -d                 # WebUI at http://localhost:8080
#   docker compose --profile mysql up -d # also start MySQL (set MC_SAVE_DATA_OPTION=db)
#   docker compose --profile sign up -d  # also start the sign service (set MC_SIGN_SRV_URL=http://signsrv:8989)
#   docker compose run --rm crawler --platform xhs --lt cookie --cookies "a=b; c=d" --type search --keywords 编程
# Any config value can be overridden with MC_<NAME>, see config/env_override.py

x-common: &common
  build: .
  image: mediacrawler:latest
  env_file:
    - path: .env
      required: false
  environment:
    MYSQL_DB_HOST: ${MYSQL_DB_HOST:-mysql}
    REDIS_DB_HOST: ${REDIS_DB_HOST:-redis}
    SQLITE_DB_PATH: /app/data/sqlite_tables.db
  volumes:
    - ./data:/app/data
    - ./browser_data:/app/browser_data

services:
  webui:
    <<: *common
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    restart: unless-stopped

  # One-off crawler runs: docker compose run --rm crawler <main.py args>
  crawler:
    <<: *common
    profiles: ["cli"]
    entrypoint: ["python", "main.py"]
    command: ["--help"]

  # Standalone sign service; point crawlers at it with MC_SIGN_SRV_URL=http://signsrv:8989
  signsrv:
    <<: *common
    profiles: ["sign"]
    command: ["uvicorn", "sign_service.server:app", "--host", "0.0.0.0", "--port", "8989"]
    environment:
      SIGN_SRV_TOKEN: ${SIGN_SRV_TOKEN:-}
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PWD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-media_crawler}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--requirepass", "${REDIS_DB_PWD:-123456}"]
    restart: unless-stopped

volumes:
  mysql_data:
